apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goal-setter-app.fullname" . }}-frontend
spec:
  replicas: {{.Values.frontend.replicaCount}}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "goal-setter-app.fullname" . }}-frontend-nginx

      containers:
      - name: frontend
        image: "{{.Values.frontend.image.repository}}:{{.Values.frontend.image.tag}}"
        imagePullPolicy: {{.Values.frontend.image.pullPolicy}}

        volumeMounts:
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf

        livenessProbe:
          httpGet:
            path: /
            port: {{.Values.frontend.service.port}}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: {{.Values.frontend.service.port}}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        ports:
        - containerPort: {{.Values.frontend.service.port}}
