apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: {{ include "goal-setter-app.fullname" . }}-mongo-keyfile

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore

  target:
    name: {{ include "goal-setter-app.fullname" . }}-mongo-keyfile
    creationPolicy: Owner

  data:
    - secretKey: mongo-keyfile
      remoteRef:
        key: goal-setter/mongodb-keyfile
        property: mongo-keyfile