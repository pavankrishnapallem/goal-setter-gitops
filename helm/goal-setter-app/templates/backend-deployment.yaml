apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goal-setter-app.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend 
        image: "{{.Values.backend.image.repository}}:{{.Values.backend.image.tag}}"
        imagePullPolicy: {{.Values.backend.image.pullPolicy}}

        ports:
        - containerPort: {{.Values.backend.service.port}} 

        livenessProbe:
          httpGet:
            path: /health
            port: {{.Values.backend.service.port}}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: {{.Values.backend.service.port}}
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        resources:
        {{ toYaml .Values.backend.resources | nindent 10}}

        envFrom:
        - configMapRef:
            name: {{ include "goal-setter-app.fullname" . }}-backend-configmap
        - secretRef:
            name: {{ include "goal-setter-app.fullname" . }}-backend-secret
